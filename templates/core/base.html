{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Заголовок страницы (переопределяется в дочерних шаблонах) -->
    <title>{% block title %}Game Library{% endblock %}</title>
    
    <!-- Базовые стили -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Доп. стили для конкретных страниц -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Шапка: логотип, поиск, меню -->
    <header class="navbar">
        <div class="container navbar__content">
            <a href="{% url 'core:game_list' %}" class="navbar__logo">GameLib</a>
            
            <!-- Поиск: отправляет запрос на фильтрацию -->
            <form id="header-search" class="navbar__search" method="get" action="{% url 'core:game_list' %}">
                <input type="search" name="search" class="form-control navbar__search-input" 
                       placeholder="Поиск по названию..." 
                       value="{{ current_filters.search|default:'' }}"
                       autocomplete="off">
                <button type="submit" class="btn btn--small btn--primary">Найти</button>
            </form>
            
            <nav class="navbar__menu">
                <a href="{% url 'core:game_list' %}">Все игры</a>
                <a href="{% url 'core:game_create' %}" class="btn btn--primary">Добавить игру</a>
            </nav>
        </div>
    </header>

    <!-- Блок сообщений (успех, ошибка и т.д.) -->
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert--{{ message.tags }}">
                    {{ message }}
                    <button class="alert__close" onclick="this.parentElement.remove()">x</button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Основной контент (переопределяется в дочерних шаблонах) -->
    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>GameLib</p>
        </div>
    </footer>

    <!-- Базовый скрипт (поиск, алерты) -->
    <script src="{% static 'js/main.js' %}"></script>
    <!-- Доп. скрипты для конкретных страниц -->
    {% block extra_js %}{% endblock %}
</body>
</html>
