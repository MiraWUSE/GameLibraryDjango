{% extends 'core/base.html' %}

{% block title %}Удалить персонажа{% endblock %}

{% block content %}
<div class="confirm-dialog">
    <h1>Удалить персонажа?</h1>
    <p>Вы уверены, что хотите удалить персонажа <strong>"{{ object.name }}"</strong>?</p>
    <p class="text-muted">Это действие нельзя отменить.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn--danger btn--large">Да, удалить</button>
            <a href="{% url 'core:game_detail' object.game.pk %}" class="btn btn--secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
