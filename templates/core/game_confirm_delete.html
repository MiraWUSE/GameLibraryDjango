{% extends 'core/base.html' %}

{% block title %}Удалить игру{% endblock %}

{% block content %}
<div class="confirm-dialog">
    <h1>🗑️ Удалить игру?</h1>
    <p>Вы уверены, что хотите удалить игру <strong>"{{ object.title }}"</strong>?</p>
    <p class="text-muted">Это действие нельзя отменить. Все связанные персонажи также будут удалены.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn--danger btn--large">Да, удалить</button>
            <a href="{% url 'core:game_detail' object.pk %}" class="btn btn--secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
